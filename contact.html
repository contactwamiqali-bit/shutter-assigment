<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Shutter</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <main class="contact-page">
        <section class="contact-content">
            <h1 class="text">Contact US</h1>
            <p class="contact-intro">
                Lorem ipsum dolor sit amet, consectetur
                <a href="#">adipisicing</a> elit. Ipsa explicabo quasi cum,
                laudantium neque at veniam itaque atque
                <a href="#">necessitatibus</a> temporibus! Beatae sit soluta
                magni neque autem, suscipit dolorem, quo alias.
            </p>

            <form class="contact-form">
                <div class="form-row">

                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName">
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName">
                    </div>

                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Write your notes or questions here..."></textarea>
                </div>

                <button type="submit">SEND MESSAGE</button>
            </form>

        </section>

        <aside class="sidebar">

            <a class="logo" href="index.html">SHUTTER</a>

            <nav>
                <a href="index.html">HOME</a>
                <a class="active" href="contact.html">CONTACT</a>
            </nav>

            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-500px"></i></a>
                <a href="#"><i class="fa-solid fa-ellipsis"></i></a>
            </div>

        </aside>
    </main>

</body>

</html>
